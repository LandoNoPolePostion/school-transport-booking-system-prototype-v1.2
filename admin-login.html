<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background: #2c3e50; color: white; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="background: white; color: black; padding: 30px; border-radius: 10px; text-align: center;">
        <h2>Admin Gateway</h2>
        <input type="password" id="pw" placeholder="Enter Secret Key" style="display: block; width: 100%; margin: 10px 0; padding: 10px;">
        <button onclick="access()" style="width: 100%; padding: 10px; background: #27ae60; color: white; border: none; cursor: pointer;">Launch System</button>
    </div>
    <script>
        function access() {
            if(document.getElementById('pw').value === 'devmode') {
                sessionStorage.setItem('auth', 'true');
                window.location.href = 'admin.html';
            } else { alert('Wrong key'); }
        }
    </script>
</body>
</html>
